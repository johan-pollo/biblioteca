services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: biblioteca_db
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biblioteca_dev}
    ports:
      - "5432:5432"
    volumes:
      - biblioteca_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca -d biblioteca_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://biblioteca:${POSTGRES_PASSWORD:-biblioteca_dev}@db:5432/biblioteca_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && fastapi run app/main.py --host 0.0.0.0 --port 8000"]

volumes:
  biblioteca_postgres_data:
